<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickup Brandeis</title>
  <!-- Inter font from Google Fonts. If it cannot load, the app falls back to the phone's own font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- #app is the phone-shaped frame. On a phone it fills the screen;
       on a computer it becomes a narrow column in the middle. -->
  <div id="app">
    <!-- The app draws every screen inside this box. -->
    <main id="screen">
      <h1>Pickup Brandeis</h1>
    </main>

    <!-- The bottom tab bar goes here (built in Task 1.4). -->
    <div id="tab-bar"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
